<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe8f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="A tiny countryside golf club maintained by animals. Nine holes of cel-shaded handheld golf for your phone." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%239ee6b8'/%3E%3Crect x='30' y='6' width='4' height='32' fill='%23fff4dc'/%3E%3Cpath d='M34 6 L52 13 L34 20Z' fill='%23ff8a73'/%3E%3Ccircle cx='24' cy='44' r='6' fill='white' stroke='%233b2f2a' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Pocket Meadow Golf</title>
    <style>
      /* Inline critical loader so something friendly shows before JS arrives. */
      html, body { margin: 0; height: 100%; background: #bfe8f7; overflow: hidden; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 800 18px ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; color: #3b2f2a; }
      #boot .bar { width: 200px; height: 14px; border: 3px solid #3b2f2a; border-radius: 10px; background: #fff4dc; overflow: hidden; margin: 12px auto 6px; }
      #boot .fill { height: 100%; width: 8%; background: #ff8a73; transition: width .25s; }
      #boot small { display: block; text-align: center; font-weight: 700; opacity: .75; }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div>
        <div style="text-align:center">Pocket Meadow Golf</div>
        <div class="bar"><div class="fill" id="bootFill"></div></div>
        <small id="bootText">Waking the caddie…</small>
      </div>
    </div>
    <div id="app"></div>
    <noscript>Pocket Meadow Golf needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
